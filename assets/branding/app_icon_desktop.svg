      <rect x="47" y="47" width="1160" height="1160" rx="184"/>
    </clipPath>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="17" stdDeviation="18" flood-color="#000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect
    x="47"
    y="47"
    width="1160"
    height="1160"
